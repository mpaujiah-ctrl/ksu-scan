name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |          
          cd sukisu/kernel
          echo "=== ksu.c 30-37 ==="; sed -n 30,37p ksu.c
          echo "=== ksu.c 83-90 ==="; sed -n 83,90p ksu.c
          echo "=== kondisi di ksu.c ==="; grep -n "^[[:space:]]*#[[:space:]]*\(if\|ifdef\|ifndef\|else\|elif\|endif\)" ksu.c || true
          echo "=== config selinux_hide ==="; grep -rn -i "selinux_hide\|SELINUX_HIDE" Kconfig Makefile ksu.c include/ || true
         
                   
      
