name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |          
          cd sukisu
          grep -rn "ksu_selinux_hide_handle" .
          sed -n 365,385p kernel/sulog/event.c
          grep -rn "user_arg_ptr" kernel/sulog/ *.h | head -20
          grep -n "kernel/sulog\|selinux" kernel/Makefile kernel/Kconfig
                   
      
