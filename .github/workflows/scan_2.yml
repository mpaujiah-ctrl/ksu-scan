name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |          
          cd sukisu/kernel
          echo "=== ksud.c includes ==="
          grep -n "#include\|selinux_hide" runtime/ksud.c | head -40 || true
          echo "=== Makefile/Kbuild selinux_hide ==="
          grep -rn "selinux_hide" Makefile Kbuild 2>/dev/null || true
          echo "=== event.c preprocessor ==="
          grep -n "^[[:space:]]*#[[:space:]]*\(if\|ifdef\|ifndef\|else\|elif\|endif\)" sulog/event.c || true
          echo "=== event.c 355-425 ==="
          sed -n 355,425p sulog/event.c
          
                   
      
