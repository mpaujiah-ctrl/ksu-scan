name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |          
          cd sukisu/kernel
          grep -n "VERSION\|rev-list\|git.*count\|KSU_VERSION" Makefile | head -30
          
                   
      
