name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/android_kernel_xiaomi_crdroid
          ref: "16.0"
          path: crdroid
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/kernel_xiaomi_cepheus_EVOX
          ref: "bka"
          path: evox
          fetch-depth: 1
      - name: Scan
        run: |
          PAT='ksu_|susfs|CONFIG_KSU|CONFIG_KERNELSU'
          cd crdroid
          git grep -lE "$PAT" -- ':!drivers/kernelsu' | sort > ../crdroid.txt
          echo "::group::crdroid: file list"; cat ../crdroid.txt; echo "::endgroup::"
          echo "::group::crdroid: drivers/kernelsu"; ls drivers/kernelsu drivers/kernelsu/hook; echo "::endgroup::"
          echo "::group::crdroid: baris hook per file"
          git grep -nE "$PAT" -- ':!drivers/kernelsu' ':!fs/susfs.c' ':!include/linux/susfs*'
          echo "::endgroup::"
          cd ../evox
          git grep -lE "$PAT" -- ':!drivers/kernelsu' | sort > ../evox.txt || true
          echo "::group::evox: file list"; cat ../evox.txt; echo "::endgroup::"
          echo "::group::DIFF crdroid vs evox (< hanya di crdroid, > hanya di evox)"
          diff ../crdroid.txt ../evox.txt || true
          echo "::endgroup::"
      - name: Detail
        run: |
          cd crdroid
          echo "::group::crdroid hook (bagian tengah)"
          git grep -n -B2 -A8 -E "ksu_|susfs|CONFIG_KSU" -- fs/namespace.c fs/notify/fdinfo.c fs/open.c fs/proc fs/proc_namespace.c fs/read_write.c fs/readdir.c fs/stat.c fs/statfs.c fs/super.c include/linux/mount.h include/linux/sched.h || true
          echo "::endgroup::"
          echo "::group::definisi hook di drivers/kernelsu"
          grep -rnE "ksu_handle_(execveat|setresuid|sys_reboot|input_handle_event)|ksu_input_hook" drivers/kernelsu | grep -v "extern" || true
          echo "::endgroup::"
          echo "::group::Kconfig KSU"
          grep -nE "^config|TAMPER|MANUAL|HOOK" drivers/kernelsu/Kconfig || true
          echo "::endgroup::"
          echo "::group::crdroid drivers/Kconfig"
          grep -n "kernelsu" drivers/Kconfig || true
          echo "::endgroup::"
          cd ../evox
          echo "::group::evox drivers/Kconfig"
          grep -n "kernelsu" drivers/Kconfig || true
          echo "::endgroup::"
    
      - name: FindKsuConfig
        run: |
          cd crdroid
          echo "::group::default value di Kconfig"
          grep -n "default" drivers/kernelsu/Kconfig
          echo "::endgroup::"
          echo "::group::file .config yang menyebut KSU"
          grep -rln "CONFIG_KSU" --include="*.config" --include="*defconfig*" . || echo "tidak ada"
          echo "::endgroup::"
          echo "::group::workflow build asli (kalau ada)"
          find . -iname "*.yml" -path "*workflows*" -exec grep -l "CONFIG_KSU\|merge_config" {} \;
          echo "::endgroup::"
     
      - name: Detail2
        run: |
          F="fs/namespace.c fs/notify/fdinfo.c fs/open.c fs/proc/base.c fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c fs/read_write.c fs/readdir.c fs/stat.c fs/statfs.c fs/namei.c"
          P='ksu_|susfs|CONFIG_KSU'
          { echo "##### CRDROID"; cd crdroid; git grep -n -B1 -A6 -E "$P" -- $F || true; cd ..
            echo "##### EVOX";    cd evox;    git grep -n -B1 -A6 -E "$P" -- $F drivers/input/input.c kernel/sys.c kernel/reboot.c fs/exec.c || true
          } > hasil.txt

      - name: Detail2
        run: |
          P='CONFIG_QSEECOM|CONFIG_QCOM_SCM|CONFIG_MSM_TZ_LOG|CONFIG_QCOM_SMCINVOKE|CONFIG_QCOM_FASTRPC|CONFIG_MSM_ADSPRPC|CONFIG_QCOM_QSEECOM'
          F="arch/arm64/configs/vendor/sm8150-perf_defconfig arch/arm64/configs/vendor/xiaomi/sm8150-common.config arch/arm64/configs/vendor/xiaomi/cepheus.config"
          cd crdroid
          grep -nE "$P" $F > ../crdroid_tz.txt || true
          
          cd ../evox
          grep -nE "$P" $F > ../evox_tz.txt || true
          
          cd ..
          echo "::group::crdroid_tz.txt"; cat crdroid_tz.txt; echo "::endgroup::"
          echo "::group::evox_tz.txt"; cat evox_tz.txt; echo "::endgroup::"
          echo "::group::DIFF"; diff crdroid_tz.txt evox_tz.txt || true; echo "::endgroup::"
         
      - name: Detail 5
        run: | 
            FILES=(
            "arch/arm64/boot/dts/qcom/cepheus-sm8150-overlay.dts"
            "arch/arm64/boot/dts/qcom/sm8150-audio-overlay.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-audio.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-gpu.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-v2.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150.dtsi"
            )
  
            echo "=== CHECKING CRDROID ==="
            cd crdroid
            for file in "${FILES[@]}"; do
              if [ -f "$file" ]; then
                if grep -q "tas2557@4c" "$file"; then
                  echo "[ADA] $file"
                else
                  echo "[TIDAK ADA] $file"
                fi
              else
                echo "[FILE TIDAK DITEMUKAN] $file"
              fi
            done
    
            echo -e "\n=== CHECKING EVOX ==="
            cd ../evox
            for file in "${FILES[@]}"; do
              if [ -f "$file" ]; then
                if grep -q "tas2557@4c" "$file"; then
                  echo "[ADA] $file"
                else
                  echo "[TIDAK ADA] $file"
                fi
              else
                echo "[FILE TIDAK DITEMUKAN] $file"
              fi
            done
     
      - name: Compare Files Between Repos
        run: |
          FILES=(
            "arch/arm64/boot/dts/qcom/cepheus-sm8150-overlay.dts"
            "arch/arm64/boot/dts/qcom/sm8150-audio-overlay.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-audio.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-gpu.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150-v2.dtsi"
            "arch/arm64/boot/dts/qcom/sm8150.dtsi"
          )
  
          for file in "${FILES[@]}"; do
            echo "=================================================="
            echo "Membandingkan: $file"
            echo "=================================================="
  
            FILE_CRDROID="crdroid/$file"
            FILE_EVOX="evox/$file"
  
            # Cek keberadaan kedua file
            if [ ! -f "$FILE_CRDROID" ] || [ ! -f "$FILE_EVOX" ]; then
              [ ! -f "$FILE_CRDROID" ] && echo "[TIDAK DITEMUKAN IN CRDROID] $FILE_CRDROID"
              [ ! -f "$FILE_EVOX" ] && echo "[TIDAK DITEMUKAN IN EVOX] $FILE_EVOX"
              continue
            fi
  
            # Bandingkan file menggunakan diff -u
            if diff -u "$FILE_CRDROID" "$FILE_EVOX" > diff_output.txt; then
              echo "[SAMA] Isi file identik di kedua repo."
            else
              echo "[BERBEDA] Ditemukan perbedaan isi file:"
              echo "--------------------------------------------------"
              cat diff_output.txt
              echo "--------------------------------------------------"
            fi
            echo ""
          done
      
      - name: Detail6
        run: |
          echo "=== CRDROID ==="
          cd crdroid
          git grep -rl "tas2557@4c" -- arch/arm64/boot/dts/ || echo "tidak ketemu"
          echo "--- kalau nama alamat i2c beda, coba pola lebih longgar ---"
          git grep -rln "tas2557" -- arch/arm64/boot/dts/ || echo "tidak ketemu sama sekali"
          cd ..
          echo "=== EVOX ==="
          cd evox
          git grep -rl "tas2557@4c" -- arch/arm64/boot/dts/ || echo "tidak ketemu"
          git grep -rln "tas2557" -- arch/arm64/boot/dts/ || echo "tidak ketemu sama sekali"
      
      - name: Detail7
        run: |
          F="arch/arm64/boot/dts/qcom/xiaomi/overlay/cepheus/cepheus-sm8150.dtsi"
          echo "::group::CRDROID - tas2557@4c"
          grep -n -B2 -A20 "tas2557@4c" crdroid/$F
          echo "::endgroup::"
          echo "::group::EVOX - tas2557@4c"
          grep -n -B2 -A20 "tas2557@4c" evox/$F
          echo "::endgroup::"
      
      - name: Detail8
        run: |
          echo "::group::CRDROID - semua yang menyebut cdc-reset-gpio atau tas2557"
          cd crdroid
          git grep -n "cdc-reset-gpio" -- arch/arm64/boot/dts/ || echo "tidak ketemu"
          git grep -rn "tas2557" -- arch/arm64/boot/dts/ | grep -v "cepheus-sm8150.dtsi"
          cd ..
          echo "::endgroup::"
          echo "::group::EVOX - semua yang menyebut cdc-reset-gpio atau tas2557"
          cd evox
          git grep -n "cdc-reset-gpio" -- arch/arm64/boot/dts/ || echo "tidak ketemu"
          git grep -rn "tas2557" -- arch/arm64/boot/dts/ | grep -v "cepheus-sm8150.dtsi"
          cd ..
          echo "::endgroup::"
      
      - name: Detail9
        run: |
          P='CS35L41|CIRRUS'
          echo "::group::CRDROID"
          cd crdroid; grep -rnE "$P" arch/arm64/configs/vendor/ 2>/dev/null; cd ..
          echo "::endgroup::"
          echo "::group::EVOX"
          cd evox; grep -rnE "$P" arch/arm64/configs/vendor/ 2>/dev/null; cd ..
          echo "::endgroup::"
      
      - name: Detail10
        run: |
          echo "::group::cari file driver cs35l41 (.c) di CRDROID"
          cd crdroid
          FC=$(git grep -l "cirrus,cs35l41" -- '*.c' 2>/dev/null | head -1 || true)
          echo "File ditemukan: $FC"
          if [ -n "$FC" ]; then
            wc -l "$FC"
            grep -n "wmfw\|dsp1\|DSP1\|request_firmware\|wm_adsp" "$FC" | head -30 || echo "(tidak ada baris cocok)"
          fi
          cd ..
          echo "::endgroup::"
          echo "::group::cari file driver cs35l41 (.c) di EVOX"
          cd evox
          FE=$(git grep -l "cirrus,cs35l41" -- '*.c' 2>/dev/null | head -1 || true)
          echo "File ditemukan: $FE"
          if [ -n "$FE" ]; then
            wc -l "$FE"
            grep -n "wmfw\|dsp1\|DSP1\|request_firmware\|wm_adsp" "$FE" | head -30 || echo "(tidak ada baris cocok)"
          fi
          cd ..
          echo "::endgroup::"
      
      - uses: actions/upload-artifact@v4
        with:
          name: hasil
          path: hasil.txt
                crdroid_tz.txt
                evox_tz.txt
