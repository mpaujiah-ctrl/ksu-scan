name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/android_kernel_xiaomi_crdroid
          ref: "16.0"
          path: crdroid
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/kernel_xiaomi_cepheus_EVOX
          ref: "bka"
          path: evox
          fetch-depth: 1
      - name: Scan
        run: |
          PAT='ksu_|susfs|CONFIG_KSU|CONFIG_KERNELSU'
          cd crdroid
          git grep -lE "$PAT" -- ':!drivers/kernelsu' | sort > ../crdroid.txt
          echo "::group::crdroid: file list"; cat ../crdroid.txt; echo "::endgroup::"
          echo "::group::crdroid: drivers/kernelsu"; ls drivers/kernelsu drivers/kernelsu/hook; echo "::endgroup::"
          echo "::group::crdroid: baris hook per file"
          git grep -nE "$PAT" -- ':!drivers/kernelsu' ':!fs/susfs.c' ':!include/linux/susfs*'
          echo "::endgroup::"
          cd ../evox
          git grep -lE "$PAT" -- ':!drivers/kernelsu' | sort > ../evox.txt || true
          echo "::group::evox: file list"; cat ../evox.txt; echo "::endgroup::"
          echo "::group::DIFF crdroid vs evox (< hanya di crdroid, > hanya di evox)"
          diff ../crdroid.txt ../evox.txt || true
          echo "::endgroup::"
      - name: Detail
        run: |
          cd crdroid
          echo "::group::crdroid hook (bagian tengah)"
          git grep -n -B2 -A8 -E "ksu_|susfs|CONFIG_KSU" -- fs/namespace.c fs/notify/fdinfo.c fs/open.c fs/proc fs/proc_namespace.c fs/read_write.c fs/readdir.c fs/stat.c fs/statfs.c fs/super.c include/linux/mount.h include/linux/sched.h || true
          echo "::endgroup::"
          echo "::group::definisi hook di drivers/kernelsu"
          grep -rnE "ksu_handle_(execveat|setresuid|sys_reboot|input_handle_event)|ksu_input_hook" drivers/kernelsu | grep -v "extern" || true
          echo "::endgroup::"
          echo "::group::Kconfig KSU"
          grep -nE "^config|TAMPER|MANUAL|HOOK" drivers/kernelsu/Kconfig || true
          echo "::endgroup::"
          echo "::group::crdroid drivers/Kconfig"
          grep -n "kernelsu" drivers/Kconfig || true
          echo "::endgroup::"
          cd ../evox
          echo "::group::evox drivers/Kconfig"
          grep -n "kernelsu" drivers/Kconfig || true
          echo "::endgroup::"
    
      - name: FindKsuConfig
        run: |
          cd crdroid
          echo "::group::default value di Kconfig"
          grep -n "default" drivers/kernelsu/Kconfig
          echo "::endgroup::"
          echo "::group::file .config yang menyebut KSU"
          grep -rln "CONFIG_KSU" --include="*.config" --include="*defconfig*" . || echo "tidak ada"
          echo "::endgroup::"
          echo "::group::workflow build asli (kalau ada)"
          find . -iname "*.yml" -path "*workflows*" -exec grep -l "CONFIG_KSU\|merge_config" {} \;
          echo "::endgroup::"
     
      - name: Detail2
        run: |
          F="fs/namespace.c fs/notify/fdinfo.c fs/open.c fs/proc/base.c fs/proc/cmdline.c fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c fs/read_write.c fs/readdir.c fs/stat.c fs/statfs.c fs/namei.c"
          P='ksu_|susfs|CONFIG_KSU'
          { echo "##### CRDROID"; cd crdroid; git grep -n -B1 -A6 -E "$P" -- $F || true; cd ..
            echo "##### EVOX";    cd evox;    git grep -n -B1 -A6 -E "$P" -- $F drivers/input/input.c kernel/sys.c kernel/reboot.c fs/exec.c || true
          } > hasil.txt

      - name: Detail2
        run: |
          P='CONFIG_QSEECOM|CONFIG_QCOM_SCM|CONFIG_MSM_TZ_LOG|CONFIG_QCOM_SMCINVOKE|CONFIG_QCOM_FASTRPC|CONFIG_MSM_ADSPRPC|CONFIG_QCOM_QSEECOM'
          F="arch/arm64/configs/vendor/sm8150-perf_defconfig arch/arm64/configs/vendor/xiaomi/sm8150-common.config arch/arm64/configs/vendor/xiaomi/cepheus.config"
          cd crdroid
          grep -nE "$P" $F > ../crdroid_tz.txt || true
          
          cd ../evox
          grep -nE "$P" $F > ../evox_tz.txt || true
          
          cd ..
          echo "::group::crdroid_tz.txt"; cat crdroid_tz.txt; echo "::endgroup::"
          echo "::group::evox_tz.txt"; cat evox_tz.txt; echo "::endgroup::"
          echo "::group::DIFF"; diff crdroid_tz.txt evox_tz.txt || true; echo "::endgroup::"
         
      - name: Detail 5
        run: | 
          cd crdroid
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/cepheus-sm8150-overlay.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-audio-overlay.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-audio.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-gpu.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-v2.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150.dtsi

          cd ../evox
          grep -nE "$P" $F > ../evox_tz.txt || true
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/cepheus-sm8150-overlay.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-audio-overlay.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-audio.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-gpu.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150-v2.dtsi
          grep -rl "tas2557@4c" arch/arm64/boot/dts/qcom/sm8150.dtsi
     
      - uses: actions/upload-artifact@v4
        with:
          name: hasil
          path: hasil.txt
                crdroid_tz.txt
                evox_tz.txt
