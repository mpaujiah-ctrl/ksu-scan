name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin-asli"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |      
          cd sukisu
          grep -rn "ksu_manager_cmd\|KSU_IOCTL_MANAGER\b\|TRACK_THRONE_FORCE_SYNCHRONOUS\|KSU_FEATURE_SELINUX_HIDE" kernel/          
          grep -rn "KSU_IOCTL_KPM\|ksu_manager_cmd\|KSU_IOCTL_MANAGER\b\|KSU_FEATURE_SELINUX_HIDE\|TRACK_THRONE_FORCE_SYNCHRONOUS" .
         
          git remote add upstream https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          git fetch upstream
          git remote -v    # cek, harus ada origin dan upstream
          git diff --stat upstream/builtin HEAD -- kernel/
