name: scan-ksu
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mpaujiah-ctrl/SukiSU-Ultra
          ref: "builtin-asli"
          path: sukisu
          fetch-depth: 1
      
      - name: Scan
        run: |      
          cd sukisu
          grep -rn "ksu_manager_cmd\|KSU_IOCTL_MANAGER\b\|TRACK_THRONE_FORCE_SYNCHRONOUS\|KSU_FEATURE_SELINUX_HIDE" kernel/
          git diff --stat https://github.com/SukiSU-Ultra/SukiSU-Ultra/tree/builtin HEAD -- kernel/
